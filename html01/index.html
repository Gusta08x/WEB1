<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade HTML 01</title>
</head>
<body>
    <!--Titulo superior da página-->
    <h1>Atividade HTML - inicio</h1>
    <!--Agrupamento de elementos-->
    <div>
        <!--Parágrafo de descrição, com "parágrafo" em negrito-->
        <p>Este é o meu primeiro <strong>parágrafo</strong> rodando em html.</p>
        <!--Linha horizontal de separação-->
        <hr>
        <!--Parágrafo com quebra de linha, link de acesso ao portal da UNEB e "HTML" em vermelho-->
        <p>Continuo aprendendo HTML,<br>agora conhecendo as tags! Com 
        <a href="https://portal.uneb.br/" target="_blank" >este link</a> 
        você pode acessar o portal da UNEB. este código eu mostro o sinal de menor &lt;</p>
        <p>O <span style="color: red;">HTML</span> é a base da web.</p>
    </div>
    <a href="https://portal.uneb.br/" target="_blank" >Acesso ao Portal da UNEB</a>
    <!--Imagem na pasta assets-->
    <img src="assets/game.jpg" alt="Imagem que representa Game">
    <!--Imagem da web-->
    <img src="https://images.tcdn.com.br/img/img_prod/841504/noticia_14793227506a5e5ce6df2a2.jpg" 
    alt="Imagem que representa Game na web">
</body>
</html>
